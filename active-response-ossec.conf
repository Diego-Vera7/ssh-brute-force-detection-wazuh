<!--
  Fragmento de /var/ossec/etc/ossec.conf (servidor Wazuh)
  Configura la respuesta activa "firewall-drop": bloquea automáticamente
  la IP de origen cuando se dispara la regla 5763 (fuerza bruta SSH).

  IMPORTANTE: ambos bloques (<command> y <active-response>) deben estar
  DENTRO de <ossec_config>...</ossec_config>, y el bloque <command> debe
  declararse ANTES de poder usarlo en <active-response> (si no, Wazuh
  rechaza el comando con el error "Invalid command 'firewall-drop'").
-->

<ossec_config>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5763</rules_id>
    <timeout>180</timeout>
  </active-response>

</ossec_config>
